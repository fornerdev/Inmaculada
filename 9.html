<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El teu amic invisible</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F3D2E;--bg-dark:#0A2E22;--cream:#FFF8EC;--gold:#F2C94C;--red:#E8453C;--red-deep:#B3261E}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Fraunces',Georgia,serif;color:var(--cream);background-color:var(--bg);
background-image:radial-gradient(circle,rgba(255,255,255,.7) 0 2px,transparent 3px),radial-gradient(circle,rgba(255,255,255,.45) 0 1.5px,transparent 2.5px);
background-size:120px 140px,190px 170px;background-position:0 0,60px 80px}
.page{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column}
.snow{position:absolute;inset:0;pointer-events:none;z-index:2;
background-image:radial-gradient(circle,rgba(255,255,255,.9) 0 3px,transparent 4px),radial-gradient(circle,rgba(255,255,255,.7) 0 2.5px,transparent 3.5px);
background-size:220px 260px,160px 260px;background-position:0 0,80px 130px;animation:snowfall 14s linear infinite}
@keyframes snowfall{from{background-position:0 0,80px 130px}to{background-position:0 260px,80px 390px}}
.garland{height:56px;background-color:var(--bg-dark);
background-image:linear-gradient(#B8964A,#B8964A),radial-gradient(circle at 50% 50%,var(--red) 0 10px,transparent 11px),radial-gradient(circle at 50% 50%,var(--gold) 0 10px,transparent 11px);
background-size:100% 3px,120px 44px,120px 44px;background-position:0 12px,0 14px,60px 14px;background-repeat:no-repeat,repeat-x,repeat-x}
main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:32px 24px;text-align:center}
.tree{width:110px;height:auto;margin-bottom:-12px}
.tw{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
h1{margin:0;max-width:720px;font-size:clamp(30px,5vw,52px);line-height:1.15;font-weight:700}
.stage{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%}
button{font-family:inherit;font-size:24px;font-weight:700;min-height:64px;padding:0 40px;color:var(--cream);background:var(--red);border:3px solid var(--gold);border-radius:999px;cursor:pointer;transition:background .15s,transform .15s}
button:hover{background:var(--red-deep);transform:translateY(-2px)}
button:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.reveal{display:none;flex-direction:column;align-items:center;gap:10px}
.reveal.on{display:flex;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.lead{font-size:22px;color:var(--cream)}
.name{font-size:clamp(40px,8vw,84px);font-weight:700;line-height:1.05;color:var(--gold)}
.note{font-size:20px;color:var(--cream)}
@media (prefers-reduced-motion:reduce){.snow,.tw,.reveal.on{animation:none}button{transition:none}}
</style>
</head>
<body>
<div class="page">
<div class="snow" aria-hidden="true"></div>
<div class="garland" aria-hidden="true"></div>
<main>
<svg class="tree" aria-hidden="true" viewBox="0 0 120 138"><polygon points="60,2 64,13 76,13 66,20 70,31 60,24 50,31 54,20 44,13 56,13" fill="#F2C94C"/><polygon points="60,18 88,56 32,56" fill="#1E7A4C"/><polygon points="60,38 98,88 22,88" fill="#249058"/><polygon points="60,64 108,120 12,120" fill="#2BA368"/><rect x="52" y="120" width="16" height="16" fill="#7A4B2A"/><circle class="tw" cx="58" cy="42" r="4" fill="#E8453C"/><circle class="tw" cx="46" cy="74" r="4" fill="#F2C94C" style="animation-delay:.4s"/><circle class="tw" cx="72" cy="68" r="4" fill="#E8453C" style="animation-delay:.8s"/><circle class="tw" cx="34" cy="108" r="4" fill="#E8453C" style="animation-delay:1.2s"/><circle class="tw" cx="60" cy="96" r="4" fill="#F2C94C" style="animation-delay:.2s"/><circle class="tw" cx="88" cy="106" r="4" fill="#F2C94C" style="animation-delay:.6s"/></svg>
<h1>Benvingut al primer amic invisible de la Inmaculada!</h1>
<div class="stage">
<button id="btn" type="button">Mostra el meu amic invisible</button>
<div id="out" class="reveal" aria-live="polite" data-n="TmF0YWxpYSBGZXJuw6FuZGV6" data-s="">
<span class="lead">El teu amic invisible és</span>
<span class="name" id="name"></span>
<span class="note" id="note"></span>
</div>
</div>
</main>
</div>
<script>
(function(){
var dec=function(s){return new TextDecoder().decode(Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)}))};
var out=document.getElementById('out'),btn=document.getElementById('btn');
btn.addEventListener('click',function(){
document.getElementById('name').textContent=dec(out.dataset.n);
if(out.dataset.s){document.getElementById('note').textContent='('+dec(out.dataset.s)+')'}
btn.style.display='none';out.classList.add('on');
});
})();
</script>
</body>
</html>
